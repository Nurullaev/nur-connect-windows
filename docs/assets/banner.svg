<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Nur Connect for Windows</title><desc id="desc">Open-source Mihomo client for Windows. Nur Connect.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#0b131f"/></linearGradient><linearGradient id="gold"><stop stop-color="#f0dca6"/><stop offset="1" stop-color="#b68a36"/></linearGradient></defs>
<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<path d="M48 268H1152" stroke="#927331" stroke-opacity=".5"/>
<text x="62" y="74" fill="#b0a58e" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">WINDOWS · MIHOMO · OPEN SOURCE</text>
<text x="58" y="163" fill="url(#gold)" font-family="Georgia,serif" font-size="72" letter-spacing="2">Nur Connect</text>
<text x="62" y="214" fill="#ddd3bb" font-family="Arial,sans-serif" font-size="22">Your subscription. Your server. One connection.</text>
<text x="62" y="297" fill="#b0a58e" font-family="Arial,sans-serif" font-size="15">nurconnect.app</text>
